[project]
name = "comfyui-teskors-utils"
description = "Smooth and stabilise OpenPose in ComfyUI: removes pose jitter, hand flicker and dropped keypoints before ControlNet."
version = "1.0.1"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
]

[project.urls]
Repository = "https://github.com/teskor-hub/comfyui-teskors-utils"

[tool.comfy]
PublisherId = "teskor"
DisplayName = "Teskor's Utils"
Icon = "https://raw.githubusercontent.com/teskor-hub/comfyui-teskors-utils/main/docs/icon.png"
